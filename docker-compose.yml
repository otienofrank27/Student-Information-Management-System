services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-usims}
      DB_USER: ${DB_USER:-sims_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-sims_admin}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      DB_LECTURER_USER: sims_lecturer
      DB_LECTURER_PASSWORD: ${DB_LECTURER_PASSWORD:?Set DB_LECTURER_PASSWORD in .env}
    volumes:
      - usims_database:/var/lib/mysql
      - ./database:/seed:ro
      - ./docker/db-init.sh:/docker-entrypoint-initdb.d/10-usims.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - usims_private

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-usims}
      DB_USER: ${DB_USER:-sims_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_ADMIN_HOST: database
      DB_ADMIN_USER: ${DB_ADMIN_USER:-sims_admin}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in .env}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Generate AUTH_PASSWORD_HASH before starting}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CORS_ORIGIN: ""
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    volumes:
      - usims_backups:/app/backups
    networks:
      - usims_private

volumes:
  usims_database:
  usims_backups:

networks:
  usims_private:
    driver: bridge
