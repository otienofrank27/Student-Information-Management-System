name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Test authentication helpers
        run: npm test --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install database schema and demonstration records
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_INSTALL_USER: root
          DB_INSTALL_PASSWORD: root
        run: bash scripts/install-database.sh

      - name: Verify database objects and mark constraints
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_ADMIN_USER: root
          DB_ADMIN_PASSWORD: root
        run: bash scripts/verify-database.sh
